name: Build and Push Underlays

on:
  workflow_dispatch:
  push:
    paths:
      - '**/Dockerfile.zivid_underlay'
      - 'core_builds/Dockerfile.core_underlay'

jobs:
  build-underlays:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Create Workspace Directory
        run: mkdir -p workspace/src

      - name: Checkout Camera Drivers
        uses: actions/checkout@v4
        with:
          path: workspace/src/flowstate-ros-camera-drivers

      - name: Checkout sdk-ros
        uses: actions/checkout@v4
        with:
          repository: intrinsic-ai/sdk-ros
          path: workspace/src/sdk-ros

      - name: Checkout Zivid Dependencies
        uses: actions/checkout@v4
        with:
          repository: zivid/zivid-ros
          path: workspace/src/zivid-ros

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Core Underlay
        uses: docker/build-push-action@v5
        with:
          context: workspace
          file: workspace/src/flowstate-ros-camera-drivers/core_builds/Dockerfile.core_underlay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/core-underlay:latest

      - name: Build and push Zivid Underlay
        uses: docker/build-push-action@v5
        with:
          context: workspace
          file: workspace/src/flowstate-ros-camera-drivers/flowstate_zivid/flowstate/Dockerfile.zivid_underlay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zivid-underlay:latest