name: Camera Drivers Presubmit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cameras: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orbbec_gemini:
              - 'flowstate_orbbec/**'
              - 'flowstate_common/**'
            luxonis:
              - 'flowstate_luxonis/**'
              - 'flowstate_common/**'
            zivid:
              - 'flowstate_zivid/**'
              - 'flowstate_common/**'

  build-bundle:
    needs: detect-changes
    if: needs.detect-changes.outputs.cameras != '[]'
    name: Build ${{ matrix.camera }} Driver
    runs-on: ubuntu-24.04
    
    strategy:
      fail-fast: false
      matrix:
        camera: ${{ fromJSON(needs.detect-changes.outputs.cameras) }}

    steps:
      - name: Create Workspace Directory
        run: mkdir -p workspace/src
      
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Camera Drivers (This Repo)
        uses: actions/checkout@v4
        with:
          path: workspace/src/flowstate-ros-camera-drivers

      - name: Checkout sdk-ros (Public)
        uses: actions/checkout@v4
        with:
          repository: intrinsic-ai/sdk-ros
          path: workspace/src/sdk-ros

      - name: Prune Docker
        run: docker system prune -af
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Alias Core Underlay
        run: |
          REMOTE_IMAGE="ghcr.io/intrinsic-dev/core-underlay:latest"
          LOCAL_TAG="intrinsic-dev-core-underlay:latest"
          
          echo "Pulling $REMOTE_IMAGE..."
          docker pull $REMOTE_IMAGE
          
          echo "Aliasing to $LOCAL_TAG..."
          docker tag $REMOTE_IMAGE $LOCAL_TAG

      - name: Fetch and Alias Underlay
        run: |
          # The daily build pushes to ghcr.io/intrinsic-dev/camera_underlay
          if [ "${{ matrix.camera }}" == "orbbec_gemini" ]; then
            REMOTE_CAMERA="orbbec"
          else
            REMOTE_CAMERA="${{ matrix.camera }}"
          fi
          REMOTE_IMAGE="ghcr.io/intrinsic-dev/${REMOTE_CAMERA}-underlay:latest"
          
          LOCAL_TAG="intrinsic-dev-${{ matrix.camera }}_driver-underlay:latest"
          
          echo "Pulling $REMOTE_IMAGE..."
          docker pull $REMOTE_IMAGE
          
          echo "Aliasing to $LOCAL_TAG..."
          docker tag $REMOTE_IMAGE $LOCAL_TAG

      - name: Build Service Bundle
        working-directory: workspace
        run: |
          chmod +x src/flowstate-ros-camera-drivers/ci_scripts/test_ci_build.sh
          TARGET_SERVICE="${{ matrix.camera }}_driver"
          
          # Map matrix name to folder name for Orbbec
          if [ "${{ matrix.camera }}" == "orbbec_gemini" ]; then
            FOLDER_NAME="flowstate_orbbec"
          else
            FOLDER_NAME="flowstate_${{ matrix.camera }}"
          fi
          
          ./src/flowstate-ros-camera-drivers/ci_scripts/test_ci_build.sh $TARGET_SERVICE $FOLDER_NAME
