# Run on the ZED Box, from the workspace root:
#   docker compose -f src/intrinsic-ros-camera-drivers/flowstate_zed/docker/compose.yaml up -d
#
# FLOWSTATE_IPC_ADDRESS must be set for every compose command (build, up, down,
# logs, ps). Set it in a .env file beside this file:
#   FLOWSTATE_IPC_ADDRESS=<address of the Flowstate IPC>
name: flowstate_zed
services:
  flowstate_zed:
    image: flowstate_zed:jazzy
    build:
      context: ../../../..
      dockerfile: src/intrinsic-ros-camera-drivers/flowstate_zed/docker/Dockerfile
    runtime: nvidia
    privileged: true
    network_mode: host
    restart: unless-stopped
    # A stop during camera start waits for the SDK open to finish: up to
    # 10.6 s measured, about 12.6 s computed. Docker's default is 10 s.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["tcp/${FLOWSTATE_IPC_ADDRESS:?set FLOWSTATE_IPC_ADDRESS}:17447"]'
    volumes:
      - /tmp:/tmp
      - /dev:/dev
      - /var/nvidia/nvcam/settings/:/var/nvidia/nvcam/settings/
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service
      - /usr/local/zed/resources/:/usr/local/zed/resources/
      - /usr/local/zed/settings/:/usr/local/zed/settings/
